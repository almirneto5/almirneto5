<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc">
  <title id="title">Perfil de Almir Neto em um terminal animado</title>
  <desc id="desc">Retrato em ASCII e informações profissionais de Almir Neto com efeitos de terminal.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#8B5CF6;#10B981;#22D3EE" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#10B981;#22D3EE;#8B5CF6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0"/>
      <stop offset="0.46" stop-color="#67E8F9" stop-opacity="0.02"/>
      <stop offset="0.5" stop-color="#67E8F9" stop-opacity="0.32"/>
      <stop offset="0.54" stop-color="#67E8F9" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#22D3EE" opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="portrait-reveal">
      <rect x="0" y="0" width="520" height="470" fill="white">
        <animate attributeName="height" values="0;0;470" keyTimes="0;0.06;1" dur="2.55s" begin="0s" fill="freeze"/>
      </rect>
    </mask>
    <clipPath id="line-0"><rect x="548" y="87" width="600" height="23"><animate attributeName="width" values="0;0;600" keyTimes="0;0.5962;1" dur="1.04s" begin="0s" fill="freeze"/></rect></clipPath><clipPath id="line-1"><rect x="548" y="111" width="600" height="23"><animate attributeName="width" values="0;0;600" keyTimes="0;0.6364;1" dur="1.16s" begin="0s" fill="freeze"/></rect></clipPath><clipPath id="line-2"><rect x="548" y="135" width="600" height="23"><animate attributeName="width" values="0;0;600" keyTimes="0;0.6693;1" dur="1.27s" begin="0s" fill="freeze"/></rect></clipPath><clipPath id="line-3"><rect x="548" y="159" width="600" height="23"><animate attributeName="width" values="0;0;600" keyTimes="0;0.6968;1" dur="1.39s" begin="0s" fill="freeze"/></rect></clipPath><clipPath id="line-4"><rect x="548" y="183" width="600" height="23"><animate attributeName="width" values="0;0;600" keyTimes="0;0.7200;1" dur="1.50s" begin="0s" fill="freeze"/></rect></clipPath><clipPath id="line-5"><rect x="548" y="207" width="600" height="23"><animate attributeName="width" values="0;0;600" keyTimes="0;0.7399;1" dur="1.61s" begin="0s" fill="freeze"/></rect></clipPath><clipPath id="line-6"><rect x="548" y="231" width="600" height="23"><animate attributeName="width" values="0;0;600" keyTimes="0;0.7572;1" dur="1.73s" begin="0s" fill="freeze"/></rect></clipPath><clipPath id="line-7"><rect x="548" y="255" width="600" height="23"><animate attributeName="width" values="0;0;600" keyTimes="0;0.7724;1" dur="1.84s" begin="0s" fill="freeze"/></rect></clipPath><clipPath id="line-8"><rect x="548" y="279" width="600" height="23"><animate attributeName="width" values="0;0;600" keyTimes="0;0.7857;1" dur="1.96s" begin="0s" fill="freeze"/></rect></clipPath><clipPath id="line-9"><rect x="548" y="303" width="600" height="23"><animate attributeName="width" values="0;0;600" keyTimes="0;0.7976;1" dur="2.08s" begin="0s" fill="freeze"/></rect></clipPath><clipPath id="line-10"><rect x="548" y="327" width="600" height="23"><animate attributeName="width" values="0;0;600" keyTimes="0;0.8082;1" dur="2.19s" begin="0s" fill="freeze"/></rect></clipPath><clipPath id="line-11"><rect x="548" y="351" width="600" height="23"><animate attributeName="width" values="0;0;600" keyTimes="0;0.8178;1" dur="2.31s" begin="0s" fill="freeze"/></rect></clipPath><clipPath id="line-12"><rect x="548" y="375" width="600" height="23"><animate attributeName="width" values="0;0;600" keyTimes="0;0.8264;1" dur="2.42s" begin="0s" fill="freeze"/></rect></clipPath><clipPath id="line-13"><rect x="548" y="399" width="600" height="23"><animate attributeName="width" values="0;0;600" keyTimes="0;0.8343;1" dur="2.54s" begin="0s" fill="freeze"/></rect></clipPath><clipPath id="line-14"><rect x="548" y="423" width="600" height="23"><animate attributeName="width" values="0;0;600" keyTimes="0;0.8415;1" dur="2.65s" begin="0s" fill="freeze"/></rect></clipPath><clipPath id="line-15"><rect x="548" y="447" width="600" height="23"><animate attributeName="width" values="0;0;600" keyTimes="0;0.8481;1" dur="2.77s" begin="0s" fill="freeze"/></rect></clipPath><clipPath id="line-16"><rect x="548" y="471" width="600" height="23"><animate attributeName="width" values="0;0;600" keyTimes="0;0.8542;1" dur="2.88s" begin="0s" fill="freeze"/></rect></clipPath>
    <style>
      text, tspan { white-space: pre; }
      .ascii { font: 8.25px "Courier New", Consolas, monospace; fill: url(#neon); letter-spacing: -0.18px; }
      .terminal { font: 12px "Courier New", Consolas, monospace; fill: #64748B; }
      .panel-title { font: 700 11px "Courier New", Consolas, monospace; fill: #22D3EE; letter-spacing: 2px; }
      .section { font: 700 12px "Courier New", Consolas, monospace; fill: #8B5CF6; letter-spacing: 1.4px; }
      .key { font: 700 14px "Courier New", Consolas, monospace; fill: #22D3EE; }
      .value { font: 14px "Courier New", Consolas, monospace; fill: #E2E8F0; }
      .dots { font: 14px "Courier New", Consolas, monospace; fill: #64748B; opacity: 0.72; }
      .ready-label { font: 700 14px "Courier New", Consolas, monospace; fill: #10B981; }
      .ready-value { font: 700 14px "Courier New", Consolas, monospace; fill: #10B981; }
    </style>
  </defs>

  <rect width="1180" height="560" rx="18" fill="url(#background)"/>
  <rect width="1180" height="560" rx="18" fill="url(#scanlines)"/>

  <g>
